<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Clover Pit: Ultimate Casino</title>
    <style>
        :root { --bg: #0d0d0d; --panel: #1a1a15; --text: #e0e0e0; --neon: #4eff4e; --gold: #ffd700; --red: #ff3333; --blue: #00d4ff; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', monospace; margin: 0; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; }
        
        /* Верхняя панель и Сейвы */
        .top-bar { width: 100%; background: #000; padding: 15px; display: flex; justify-content: space-around; align-items: center; border-bottom: 3px solid #333; position: sticky; top: 0; z-index: 100; font-size: 20px; font-weight: bold; }
        .save-load-btn { background: #333; color: #fff; border: 1px solid #555; padding: 5px 15px; cursor: pointer; border-radius: 5px; font-size: 14px; }
        .save-load-btn:hover { background: #555; }

        .main-container { display: flex; gap: 20px; padding: 20px; width: 100%; max-width: 1600px; box-sizing: border-box; justify-content: center; }
        .side-panel { flex: 1; background: var(--panel); border: 2px solid #444; padding: 15px; border-radius: 10px; height: 600px; overflow-y: auto; }
        .side-panel h3 { color: var(--gold); border-bottom: 2px solid #444; padding-bottom: 10px; margin-top: 0; text-align: center; }

        /* Игровое поле */
        .center-board { flex: 1.5; display: flex; flex-direction: column; align-items: center; min-width: 550px; }
        .grid { display: grid; grid-template-columns: repeat(5, 95px); grid-template-rows: repeat(3, 95px); gap: 10px; background: #222; padding: 15px; border: 6px solid #444; border-radius: 15px; box-shadow: 0 0 40px rgba(0,0,0,0.8); position: relative; }
        .slot { width: 95px; height: 95px; background: #000; border: 2px solid #333; display: flex; justify-content: center; align-items: center; font-size: 55px; border-radius: 8px; transition: transform 0.1s; }
        .win-highlight { border-color: var(--neon); box-shadow: inset 0 0 20px var(--neon); background: #0a250a; z-index: 5; transform: scale(1.05); }

        /* Эффект Джекпота */
        .jackpot-effect { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(circle, rgba(255,215,0,0.4) 0%, transparent 70%); z-index: 999; display: none; animation: flash 0.2s infinite alternate; }
        @keyframes flash { from { opacity: 0.5; } to { opacity: 1; } }

        /* Скример коллекторов */
        #screamer { position: fixed; inset: 0; background: #f00; z-index: 9999; display: none; justify-content: center; align-items: center; flex-direction: column; font-size: 100px; font-weight: bold; color: #000; text-shadow: 0 0 20px #fff; animation: shakeScreamer 0.1s infinite; }
        @keyframes shakeScreamer { 0% { transform: translate(10px, 10px); background: #000; color: #f00; } 50% { transform: translate(-10px, -10px); background: #f00; color: #000; } 100% { transform: translate(10px, -10px); } }

        table { width: 100%; border-collapse: collapse; font-size: 16px; }
        th { text-align: left; color: var(--blue); padding-bottom: 10px; }
        td { padding: 8px 0; border-bottom: 1px solid #333; }

        /* Мини-сетки для комбо */
        .group-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #333; font-size: 16px; font-weight: bold; }
        .mini-grid { display: grid; grid-template-columns: repeat(5, 12px); grid-template-rows: repeat(3, 12px); gap: 2px; }
        .mini-cell { background: #333; border-radius: 2px; }
        .mini-cell.active { background: var(--neon); box-shadow: 0 0 3px var(--neon); }

        /* Кнопки */
        .btn { padding: 15px 30px; font-family: inherit; font-weight: bold; cursor: pointer; border: 3px solid #555; border-radius: 12px; transition: 0.2s; }
        .btn-spin { background: var(--red); color: #fff; font-size: 30px; width: 400px; margin: 10px 0; }
        .btn-session { background: var(--gold); color: #000; font-size: 20px; width: 400px; }
        .btn-auto { background: #444; color: #fff; border-color: #888; margin-bottom: 10px; width: 400px; }
        .btn-auto.active { background: var(--neon); color: #000; border-color: #fff; }
        .btn:hover:not(:disabled) { transform: scale(1.02); filter: brightness(1.2); }
        .btn:disabled { opacity: 0.2; cursor: not-allowed; }

        /* Магазин и Кредит */
        .bottom-panels { display: flex; gap: 20px; width: 95%; max-width: 1600px; margin-bottom: 50px; }
        .shop-container { flex: 3; background: var(--panel); padding: 20px; border: 3px solid #444; border-radius: 15px; }
        .shop-slots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; margin-top: 15px; }
        .shop-card { background: #111; border: 2px solid #555; padding: 15px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; height: 160px; border-radius: 10px; }
        
        .loan-container { flex: 1; background: #3a1a1a; padding: 20px; border: 3px solid #f00; border-radius: 15px; text-align: center; }
        .loan-btn { background: #000; color: #f00; border: 1px solid #f00; padding: 10px; cursor: pointer; width: 100%; margin: 5px 0; font-weight: bold; }
        .loan-btn:hover:not(:disabled) { background: #f00; color: #000; }
        .loan-btn:disabled { border-color: #555; color: #555; cursor: not-allowed; }
    </style>
</head>
<body>

<div id="jackpot-fx" class="jackpot-effect"></div>
<div id="screamer">ОТДАЙ ДОЛГ!</div>

<div class="top-bar">
    <div>
        <button class="save-load-btn" onclick="exportJSON()">💾 СОХРАНИТЬ</button>
        <button class="save-load-btn" onclick="document.getElementById('import-file').click()">📂 ЗАГРУЗИТЬ</button>
        <input type="file" id="import-file" style="display:none" accept=".json" onchange="importJSON(event)">
    </div>
    <div>💰 БАЛАНС: <span id="balance" style="color:var(--gold)">200</span> Φ</div>
    <div id="spins-status" style="color:var(--neon)">СЕССИЯ: ОКОНЧЕНА</div>
    <div>🚀 ОБЩ. МНОЖ: X<span id="global-mult">1.0</span></div>
</div>

<div class="main-container">
    <div class="side-panel">
        <h3>СИМВОЛЫ</h3>
        <table>
            <thead><tr><th>Символ</th><th>Цена</th><th>Шанс</th></tr></thead>
            <tbody id="sym-table-body"></tbody>
        </table>
    </div>

    <div class="center-board">
        <div id="win-log" style="font-size: 28px; color: var(--neon); font-weight: bold; height: 40px;"></div>
        <div class="grid" id="grid"></div>
        <button id="btn-auto" class="btn btn-auto" onclick="toggleAuto()">АВТОРЕЖИМ: ВЫКЛ</button>
        <button id="btn-session" class="btn btn-session" onclick="buySession()">КУПИТЬ 7 СПИНОВ (14 Φ)</button>
        <button id="btn-spin" class="btn btn-spin" onclick="spin()" disabled>КРУТИТЬ (0)</button>
    </div>

    <div class="side-panel">
        <h3>ГРУППЫ КОМБО</h3>
        <div id="combo-groups-list"></div>
    </div>
</div>

<div class="bottom-panels">
    <div class="shop-container">
        <div style="display:flex; justify-content:space-between; align-items:center">
            <h2 style="margin:0; color:var(--blue)">🛒 МАГАЗИН ТАЛИСМАНОВ</h2>
            <button class="btn" style="padding:10px; font-size:16px" onclick="manualRefreshShop()" id="btn-refresh">ОБНОВИТЬ (10 Φ)</button>
        </div>
        <div class="shop-slots" id="shop-slots"></div>
    </div>

    <div class="loan-container">
        <h2 style="margin:0; color:#f00">БАНК</h2>
        <div style="font-size:24px; margin: 10px 0;">ДОЛГ: <span id="debt-amount">0</span> Φ</div>
        <div style="font-size:18px; color:var(--gold); margin-bottom: 15px;">ТАЙМЕР: <span id="debt-timer">0</span> сек</div>
        <button class="loan-btn" id="btn-take-loan" onclick="takeLoan()">ВЗЯТЬ КРЕДИТ (500 Φ)</button>
        <button class="loan-btn" id="btn-pay-10" onclick="payLoan(0.1)" disabled>ПОГАСИТЬ 10%</button>
        <button class="loan-btn" id="btn-pay-all" onclick="payLoan(1)" disabled>ПОГАСИТЬ ВСЁ</button>
    </div>
</div>

<script>
    // --- АУДИО ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = new AudioContext();

    function playSound(freq, type, duration, vol = 0.1) {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + duration);
    }

    const sfx = {
        stop: () => playSound(150, 'square', 0.1, 0.05),
        win: () => { playSound(523, 'sine', 0.3); setTimeout(() => playSound(659, 'sine', 0.3), 100); setTimeout(() => playSound(783, 'sine', 0.4), 200); },
        jackpot: () => { playSound(800, 'square', 0.5, 0.2); setTimeout(() => playSound(1000, 'square', 0.5, 0.2), 200); setTimeout(() => playSound(1200, 'square', 1, 0.2), 400); },
        buy: () => { playSound(800, 'sine', 0.1); setTimeout(() => playSound(1200, 'sine', 0.2), 50); },
        error: () => playSound(100, 'sawtooth', 0.3, 0.1),
        screamer: () => playSound(50, 'sawtooth', 5, 1)
    };

    // --- ДАННЫЕ ИГРЫ ---
    let balance = 200; let globalMult = 1.0; let spinsLeft = 0; let sessionCost = 14; 
    let isSpinning = false; let autoMode = false;
    let debt = 0; let loanTime = 0; let loanInterval = null; let isDead = false;

    let symbols = [
        { id: 0, char: '🍋', weight: 40, price: 2, bonusPrice: 0 }, { id: 1, char: '🍒', weight: 40, price: 2, bonusPrice: 0 },
        { id: 2, char: '🍀', weight: 30, price: 3, bonusPrice: 0 }, { id: 3, char: '🔔', weight: 30, price: 3, bonusPrice: 0 },
        { id: 4, char: '💎', weight: 15, price: 5, bonusPrice: 0 }, { id: 5, char: '🎁', weight: 10, price: 7, bonusPrice: 0 },
        { id: 6, char: '7️⃣', weight: 5,  price: 10, bonusPrice: 0 }
    ];

    let comboGroups = {
        "Гор. M": { mult: 1.0, bonus: 0 }, "Верт.": { mult: 1.0, bonus: 0 }, "Диаг.": { mult: 1.5, bonus: 0 },
        "Гор. L": { mult: 2.0, bonus: 0 }, "Гор. XL": { mult: 3.0, bonus: 0 }, "Вверх/Вниз": { mult: 4.0, bonus: 0 },
        "Небо/Земля": { mult: 7.0, bonus: 0 }, "Глаз": { mult: 8.0, bonus: 0 }, "Джекпот": { mult: 50.0, bonus: 0 }
    };

    const patterns = [
        { group: "Гор. M", c:[[0,0],[0,1],[0,2]] }, { group: "Верт.", c:[[0,0],[1,0],[2,0]] }, { group: "Диаг.", c:[[0,0],[1,1],[2,2]] },
        { group: "Гор. L", c:[[0,0],[0,1],[0,2],[0,3]] }, { group: "Гор. XL",c:[[1,0],[1,1],[1,2],[1,3],[1,4]] },
        { group: "Вверх/Вниз", c:[[2,0],[1,1],[0,2],[1,3],[2,4]] }, { group: "Небо/Земля", c:[[2,0],[2,1],[2,2],[2,3],[2,4],[1,1],[1,3],[0,2]] },
        { group: "Глаз", c:[[0,1],[0,2],[0,3],[1,0],[1,1],[1,3],[1,4],[2,1],[2,2],[2,3]] }, { group: "Джекпот",c:Array.from({length:15},(_,i)=>[Math.floor(i/5),i%5]) }
    ];
    // Полный список паттернов скрыт для оптимизации (добавлены только репрезентативные для отрисовки). 
    // В реальной проверке нужны все. Ниже добавлен полный скрытый массив проверок.
    const allPatternsCheck = [
        { g: "Гор. M", c:[[0,0],[0,1],[0,2]] }, { g: "Гор. M", c:[[0,1],[0,2],[0,3]] }, { g: "Гор. M", c:[[0,2],[0,3],[0,4]] }, { g: "Гор. M", c:[[1,0],[1,1],[1,2]] }, { g: "Гор. M", c:[[1,1],[1,2],[1,3]] }, { g: "Гор. M", c:[[1,2],[1,3],[1,4]] }, { g: "Гор. M", c:[[2,0],[2,1],[2,2]] }, { g: "Гор. M", c:[[2,1],[2,2],[2,3]] }, { g: "Гор. M", c:[[2,2],[2,3],[2,4]] },
        { g: "Верт.", c:[[0,0],[1,0],[2,0]] }, { g: "Верт.", c:[[0,1],[1,1],[2,1]] }, { g: "Верт.", c:[[0,2],[1,2],[2,2]] }, { g: "Верт.", c:[[0,3],[1,3],[2,3]] }, { g: "Верт.", c:[[0,4],[1,4],[2,4]] },
        { g: "Диаг.", c:[[0,0],[1,1],[2,2]] }, { g: "Диаг.", c:[[0,1],[1,2],[2,3]] }, { g: "Диаг.", c:[[0,2],[1,3],[2,4]] }, { g: "Диаг.", c:[[0,2],[1,1],[2,0]] }, { g: "Диаг.", c:[[0,3],[1,2],[2,1]] }, { g: "Диаг.", c:[[0,4],[1,3],[2,2]] },
        { g: "Гор. L", c:[[0,0],[0,1],[0,2],[0,3]] }, { g: "Гор. L", c:[[0,1],[0,2],[0,3],[0,4]] }, { g: "Гор. L", c:[[1,0],[1,1],[1,2],[1,3]] }, { g: "Гор. L", c:[[1,1],[1,2],[1,3],[1,4]] }, { g: "Гор. L", c:[[2,0],[2,1],[2,2],[2,3]] }, { g: "Гор. L", c:[[2,1],[2,2],[2,3],[2,4]] },
        { g: "Гор. XL",c:[[0,0],[0,1],[0,2],[0,3],[0,4]] }, { g: "Гор. XL",c:[[1,0],[1,1],[1,2],[1,3],[1,4]] }, { g: "Гор. XL",c:[[2,0],[2,1],[2,2],[2,3],[2,4],[1,1],[1,3],[0,2]] },
        { g: "Вверх/Вниз", c:[[2,0],[1,1],[0,2],[1,3],[2,4]] }, { g: "Вверх/Вниз", c:[[0,0],[1,1],[2,2],[1,3],[0,4]] },
        { g: "Небо/Земля", c:[[0,0],[0,1],[0,2],[0,3],[0,4],[1,1],[1,3],[2,2]] }, { g: "Небо/Земля", c:[[2,0],[2,1],[2,2],[2,3],[2,4],[1,1],[1,3],[0,2]] },
        { g: "Глаз", c:[[0,1],[0,2],[0,3],[1,0],[1,1],[1,3],[1,4],[2,1],[2,2],[2,3]] }, { g: "Джекпот",c:Array.from({length:15},(_,i)=>[Math.floor(i/5),i%5]) }
    ];

    let currentShopItems = [];

    // --- ИНИЦИАЛИЗАЦИЯ И РЕНДЕР ---
    const gridEl = document.getElementById('grid');
    for(let i=0; i<15; i++) {
        const d = document.createElement('div'); d.className = 'slot'; d.id = `s-${i}`; d.innerText = '●'; gridEl.appendChild(d);
    }

    function renderMiniGrid(coords) {
        let html = '<div class="mini-grid">';
        for(let r=0; r<3; r++) {
            for(let c=0; c<5; c++) {
                let isActive = coords.some(pos => pos[0]===r && pos[1]===c);
                html += `<div class="mini-cell ${isActive?'active':''}"></div>`;
            }
        }
        return html + '</div>';
    }

    function updateUI() {
        if(isDead) return;
        document.getElementById('balance').innerText = Math.floor(balance);
        document.getElementById('global-mult').innerText = globalMult.toFixed(1);
        
        document.getElementById('spins-status').innerText = spinsLeft > 0 ? `🔥 СЕССИЯ: ${spinsLeft} СПИНОВ` : `💤 СЕССИЯ ОКОНЧЕНА`;
        document.getElementById('btn-spin').disabled = isSpinning || spinsLeft <= 0 || autoMode;
        document.getElementById('btn-spin').innerText = `КРУТИТЬ (${spinsLeft})`;
        document.getElementById('btn-session').disabled = balance < sessionCost || spinsLeft > 0 || autoMode;

        let totalW = symbols.reduce((a,b) => a + b.weight, 0);
        document.getElementById('sym-table-body').innerHTML = symbols.map(s => `<tr><td>${s.char}</td><td>${s.price+s.bonusPrice}</td><td>${((s.weight/totalW)*100).toFixed(1)}%</td></tr>`).join('');

        document.getElementById('combo-groups-list').innerHTML = Object.entries(comboGroups).map(([name, data]) => {
            let pat = patterns.find(p => p.group === name);
            return `<div class="group-row">
                <div style="display:flex; align-items:center; gap:10px;">${renderMiniGrid(pat.c)} <span>${name}</span></div>
                <span style="color:var(--neon)">X${(data.mult + data.bonus).toFixed(1)}</span>
            </div>`;
        }).join('');

        document.getElementById('debt-amount').innerText = Math.floor(debt);
        document.getElementById('debt-timer').innerText = loanTime;
        document.getElementById('btn-take-loan').disabled = debt > 0;
        document.getElementById('btn-pay-10').disabled = debt <= 0 || balance < Math.ceil(debt*0.1);
        document.getElementById('btn-pay-all').disabled = debt <= 0 || balance < debt;

        renderShop();
    }

    // --- МАГАЗИН И СОХРАНЕНИЯ ---
    function generateShopItems() {
        let pool = [];
        symbols.forEach(s => pool.push({ type:'price', id:s.id, cost: 50, title: `Цена ${s.char} +1` }));
        symbols.forEach(s => { pool.push({ type:'weight_up', id:s.id, cost: 40, title: `Шанс ${s.char} +5` }); pool.push({ type:'weight_down', id:s.id, cost: 30, title: `Шанс ${s.char} -5` }); });
        Object.keys(comboGroups).forEach(name => pool.push({ type:'combo', group:name, cost: 60, title: `Множ. ${name} +0.5` }));
        pool.push({ type:'global', cost: 120, title: `Общий множ. +0.1` });

        currentShopItems = [];
        for(let i=0; i<5; i++) currentShopItems.push({...pool[Math.floor(Math.random()*pool.length)]});
    }

    function renderShop() {
        document.getElementById('shop-slots').innerHTML = currentShopItems.map((item, idx) => `
            <div class="shop-card"><h4>${item.title}</h4>
            <button class="btn btn-buy" style="background:#222; color:var(--neon)" onclick="buyItem(${idx})" ${(balance<item.cost || spinsLeft>0 || item.sold || autoMode) ? 'disabled':''}>${item.sold ? 'КУПЛЕНО' : item.cost+' Φ'}</button></div>
        `).join('');
    }

    function buyItem(idx) {
        let item = currentShopItems[idx];
        if(balance >= item.cost) { balance -= item.cost; sfx.buy();
            if(item.type === 'price') symbols[item.id].bonusPrice++;
            if(item.type === 'weight_up') symbols[item.id].weight += 5;
            if(item.type === 'weight_down') symbols[item.id].weight = Math.max(1, symbols[item.id].weight - 5);
            if(item.type === 'combo') comboGroups[item.group].bonus += 0.5;
            if(item.type === 'global') globalMult += 0.1;
            item.sold = true; updateUI();
        }
    }

    function manualRefreshShop() { if(balance >= 10 && spinsLeft === 0 && !autoMode) { balance -= 10; generateShopItems(); updateUI(); } }

    function exportJSON() {
        let data = JSON.stringify({ balance, globalMult, debt, loanTime, symbols, comboGroups });
        let blob = new Blob([data], {type: "application/json"});
        let url = URL.createObjectURL(blob);
        let a = document.createElement('a'); a.href = url; a.download = 'clover_pit_save.json'; a.click();
    }

    function importJSON(e) {
        let file = e.target.files[0]; if(!file) return;
        let reader = new FileReader();
        reader.onload = (ev) => {
            try {
                let s = JSON.parse(ev.target.result);
                if(s.balance !== undefined) balance = s.balance;
                if(s.globalMult !== undefined) globalMult = s.globalMult;
                if(s.debt !== undefined) debt = s.debt;
                if(s.loanTime !== undefined) loanTime = s.loanTime;
                
                // Безопасное слияние массивов (чтобы старые сейвы работали с новыми символами)
                if(s.symbols) s.symbols.forEach(sv => { let t = symbols.find(x => x.id === sv.id); if(t) { t.weight = sv.weight; t.bonusPrice = sv.bonusPrice; }});
                if(s.comboGroups) Object.keys(s.comboGroups).forEach(k => { if(comboGroups[k]) comboGroups[k].bonus = s.comboGroups[k].bonus; });
                
                if(debt > 0 && !loanInterval) startLoanTimer();
                updateUI();
            } catch(err) { alert("Ошибка файла сохранения!"); }
        };
        reader.readAsText(file);
    }

    // --- КРЕДИТЫ И АВТО ---
    function takeLoan() { if(debt === 0) { balance += 500; debt = 500; loanTime = 60; startLoanTimer(); updateUI(); } }
    function payLoan(percent) {
        let amt = percent === 1 ? debt : Math.ceil(debt * 0.1);
        if(balance >= amt && debt > 0) {
            balance -= amt; debt -= amt; loanTime = 60;
            if(debt <= 0) { debt = 0; clearInterval(loanInterval); loanInterval = null; }
            updateUI();
        }
    }
    function startLoanTimer() {
        if(loanInterval) clearInterval(loanInterval);
        loanInterval = setInterval(() => {
            if(isDead) return;
            loanTime--; updateUI();
            if(loanTime <= 0) triggerScreamer();
        }, 1000);
    }
    function triggerScreamer() {
        isDead = true; clearInterval(loanInterval); autoMode = false;
        document.getElementById('screamer').style.display = 'flex';
        sfx.screamer();
    }

    function toggleAuto() {
        autoMode = !autoMode;
        const btn = document.getElementById('btn-auto');
        if(autoMode) { btn.innerText = "АВТОРЕЖИМ: ВКЛ"; btn.classList.add('active'); runAuto(); }
        else { btn.innerText = "АВТОРЕЖИМ: ВЫКЛ"; btn.classList.remove('active'); }
        updateUI();
    }

    async function runAuto() {
        if(!autoMode || isDead) return;
        if(spinsLeft <= 0) {
            if(balance >= sessionCost) { buySession(); await new Promise(r => setTimeout(r, 500)); }
            else { toggleAuto(); return; }
        }
        await spin();
        if(autoMode) setTimeout(runAuto, 500);
    }

    // --- ИГРОВОЙ ЦИКЛ ---
    function buySession() { if(balance >= sessionCost) { balance -= sessionCost; spinsLeft = 7; sfx.buy(); updateUI(); } }

    async function spin() {
        if(spinsLeft <= 0 || isSpinning) return;
        isSpinning = true; spinsLeft--;
        document.getElementById('win-log').innerText = "";
        document.querySelectorAll('.slot').forEach(s => { s.classList.remove('win-highlight'); s.style.transform = 'translateY(10px)'; });
        updateUI();

        let matrix = [[],[],[]];
        for(let c=0; c<5; c++) {
            for(let r=0; r<3; r++) {
                let s = symbols.reduce((a,b)=>a+b.weight,0); let rnd = Math.random()*s; let sym = symbols[0];
                for(let item of symbols) { if(rnd < item.weight) { sym = item; break; } rnd -= item.weight; }
                matrix[r][c] = sym;
                const slot = document.getElementById(`s-${r*5+c}`);
                slot.innerText = sym.char; slot.style.transform = 'translateY(0)';
            }
            sfx.stop(); await new Promise(res => setTimeout(res, 100));
        }

        let totalWin = 0; let gotJackpot = false;
        allPatternsCheck.forEach(p => {
            let firstChar = matrix[p.c[0][0]][p.c[0][1]].char;
            if(p.c.every(pos => matrix[pos[0]][pos[1]].char === firstChar)) {
                let sym = symbols.find(s => s.char === firstChar); let group = comboGroups[p.g];
                totalWin += (sym.price + sym.bonusPrice) * (group.mult + group.bonus) * globalMult;
                if(p.g === "Джекпот") gotJackpot = true;
                p.c.forEach(pos => document.getElementById(`s-${pos[0]*5+pos[1]}`).classList.add('win-highlight'));
            }
        });

        if(totalWin > 0) {
            balance += totalWin;
            document.getElementById('win-log').innerText = `🏆 ВЫИГРЫШ: +${totalWin.toFixed(1)} Φ`;
            if(gotJackpot) {
                sfx.jackpot(); document.getElementById('jackpot-fx').style.display = 'block';
                setTimeout(() => document.getElementById('jackpot-fx').style.display = 'none', 2000);
            } else sfx.win();
        }

        isSpinning = false; if(spinsLeft === 0) generateShopItems();
        updateUI();
    }

    generateShopItems(); updateUI();
</script>
</body>
</html>
